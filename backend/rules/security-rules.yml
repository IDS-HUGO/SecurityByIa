rules:
  - id: py-command-injection
    pattern-either:
      - pattern: os.system($CMD)
      - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
      - pattern: subprocess.call($CMD, ..., shell=True, ...)
      - pattern: subprocess.run($CMD, ..., shell=True, ...)
    message: "Detected potential OS command injection via unvalidated system execution."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: "A03:2021 - Injection"
      category: "security"

  - id: py-sql-injection-concat
    pattern-either:
      - pattern: $DB.execute("..." + $VAL, ...)
      - pattern: $DB.execute(f"...{$VAL}...", ...)
      - pattern: $DB.execute("...%s..." % $VAL, ...)
      - pattern: 'query = "..." + $VAL'
      - pattern: 'query = f"...{$VAL}..."'
    message: "Detected SQL injection risk: dynamic SQL query constructed via concatenation."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: "A03:2021 - Injection"
      category: "security"

  - id: py-code-injection-eval
    pattern-either:
      - pattern: eval($CODE)
      - pattern: exec($CODE)
    message: "Detected arbitrary code execution via eval() or exec()."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-94: Improper Control of Generation of Code ('Code Injection')"]
      owasp: "A03:2021 - Injection"
      category: "security"

  - id: py-broken-crypto-md5
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
    message: "Detected broken or weak cryptographic hash function (MD5/SHA1)."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
      owasp: "A02:2021 - Cryptographic Failures"
      category: "security"

  - id: py-hardcoded-secret
    pattern-either:
      - pattern: $VAR = "admin123"
      - pattern: $VAR = "secret"
      - pattern: password = "..."
      - pattern: api_key = "..."
      - pattern: token = "..."
    message: "Detected possible hardcoded credentials or secret in source code."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: "security"

  - id: py-path-traversal
    pattern-either:
      - pattern: open("..." + $FILE, ...)
      - pattern: open(f"...{$FILE}...", ...)
    message: "Detected potential path traversal vulnerability in file access."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: "A01:2021 - Broken Access Control"
      category: "security"

  - id: py-insecure-deserialization
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: yaml.load($INPUT)
    message: "Detected unsafe deserialization of untrusted input."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: "A08:2021 - Software and Data Integrity Failures"
      category: "security"

  - id: py-reflected-xss
    pattern-either:
      - pattern: render_template_string("..." + $INPUT, ...)
      - pattern: return "..." + $INPUT + "..."
    message: "Detected potential reflected cross-site scripting (XSS)."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: "A03:2021 - Injection"
      category: "security"
