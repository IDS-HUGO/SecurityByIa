# Pipeline de seguridad en GitHub Actions (SAST, secrets y gate de severidad).

name: Security Scan

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC — análisis programado

permissions:
  contents: read

env:
  # Umbral del gate (configurable): severidad mínima que bloquea el PR.
  # critical | high | medium | low. Default: critical (inventario, control 9).
  CHECK_FAIL_SEVERITY: critical

jobs:
  sast-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo (sin credenciales residuales)
        # actions/checkout v4.2.2 — fijado por SHA (control 20)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0 # Gitleaks sin --no-git necesita el historial completo
          persist-credentials: false

      - name: Configurar Python
        # actions/setup-python v5.6.0 — fijado por SHA (control 20)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: pip install "semgrep==1.182.1" pyyaml

      - name: Semgrep (reglas locales + por control + OWASP versionado)
        id: semgrep
        working-directory: backend
        # Sin `|| true`: exit 0/1 (con hallazgos) sigue; exit >= 2 falla el job.
        # Excluye ejemplos intencionales de benchmark y suites de prueba para no bloquear CI
        run: |
          set +e
          semgrep \
            --config rules/security-rules.yml \
            --config rules/semgrep \
            --config rules/vendor/owasp-top-ten.json \
            --exclude "bench/examples" \
            --exclude "*/bench/examples" \
            --exclude "tests" \
            --json --quiet .. > ../semgrep-results.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Descargar Gitleaks con checksum verificado (control 20)
        run: |
          GITLEAKS_VERSION=8.21.2
          GITLEAKS_SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Gitleaks (historial completo, secretos redactados en el reporte)
        id: gitleaks
        # exit 1 = secretos encontrados (el gate decide); exit >= 2 = error real.
        run: |
          set +e
          ./gitleaks detect --report-format json --report-path gitleaks-results.json --redact
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Gate de severidad (falla el PR con hallazgos >= CHECK_FAIL_SEVERITY)
        run: |
          python backend/scripts/security_gate.py \
            --semgrep semgrep-results.json \
            --gitleaks gitleaks-results.json \
            --fail-severity "$CHECK_FAIL_SEVERITY"

      - name: Subir reportes
        # actions/upload-artifact v4.6.2 — fijado por SHA (control 20)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-reports
          path: |
            semgrep-results.json
            gitleaks-results.json
          if-no-files-found: ignore

  scheduled-analysis:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la plataforma (sin credenciales residuales)
        # actions/checkout v4.2.2 — fijado por SHA (control 20)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Configurar Python
        # actions/setup-python v5.6.0 — fijado por SHA (control 20)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Instalar la plataforma
        run: pip install -r backend/requirements.txt

      - name: Análisis programado con historial completo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional, solo por entorno: nunca commitear claves.
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: backend
        run: |
          python analyzer.py --url "https://github.com/${{ github.repository }}" --full-history

      - name: Subir reportes generados
        # actions/upload-artifact v4.6.2 — fijado por SHA (control 20)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-analysis-report
          path: |
            backend/reporte_seguridad.json
            backend/reporte_seguridad.md
            backend/reporte_seguridad.sarif
          if-no-files-found: ignore
