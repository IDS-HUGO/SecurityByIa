# Security Control Center — servicio SAST + secret scanning + benchmark
services:
  security-control-center:
    build:
      context: .
      args:
        GITLEAKS_VERSION: "8.21.2"
    image: security-control-center:latest
    container_name: security-control-center
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      MAX_CONCURRENT_ANALYSES: "2"
      RATE_LIMIT_PER_MINUTE: "30"
      # Opcionales: descomentar y cargar por entorno, nunca commitear claves.
      # GEMINI_API_KEY: ${GEMINI_API_KEY}
      # GEMINI_MODEL: gemini-1.5-flash
      # SECURITY_MAX_REPO_MB: "200"
      # SECURITY_CLONE_TIMEOUT: "300"
      # SECURITY_TOTAL_TIMEOUT: "1200"
    volumes:
      - ./storage:/app/storage   # el historial sobrevive a reinicios del contenedor
    restart: unless-stopped
