# Security Control Center — Plataforma de Seguridad de Aplicaciones (F4B: Frontend + Backend)
services:
  backend:
    build:
      context: ./backend
      args:
        GITLEAKS_VERSION: "8.21.2"
    image: security-control-center-backend:latest
    container_name: scc-backend
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      MAX_CONCURRENT_ANALYSES: "2"
      RATE_LIMIT_PER_MINUTE: "30"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:5173,http://127.0.0.1:5173"
      # Proxy de secretos (F8): los agentes salen a los proveedores a través del
      # proxy con un token limitado y NUNCA leen la clave del proveedor directo
      # mientras esta variable esté configurada (fail-closed).
      SECURITY_PROXY_URL: "http://proxy:5001"
      SECURITY_PROXY_TOKEN: "${SECURITY_PROXY_TOKEN}"
      # Opcionales del check de PR (F7): umbral y evaluación de solo nuevos.
      # CHECK_FAIL_SEVERITY: "critical"
      # CHECK_FAIL_ONLY_NEW: "true"
      REPORT_BASE_URL: "http://localhost:5000"
      # Webhook de GitHub (opcional): configurar el mismo secreto en el webhook
      # del repositorio; sin él el endpoint /webhooks/github responde 503.
      # GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      # GITHUB_TOKEN: ${GITHUB_TOKEN}
      # El backend recibe solo el nombre del modelo; la clave vive en el proxy.
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      # SECURITY_MAX_REPO_MB: "200"
      # SECURITY_CLONE_TIMEOUT: "300"
      # SECURITY_TOTAL_TIMEOUT: "1200"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      proxy:
        condition: service_started
    restart: unless-stopped

  proxy:
    image: security-control-center-backend:latest
    container_name: scc-proxy
    command: ["python", "-m", "proxy.server"]
    ports:
      - "5001:5001"
    environment:
      PROXY_HOST: "0.0.0.0"
      PROXY_PORT: "5001"
      # Claves de proveedores: viven SOLO en este servicio, nunca en el backend.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Tokens limitados: JSON con hash SHA-256 (ver docs/proxy.md para generarlo).
      PROXY_TOKENS: "${PROXY_TOKENS:-[]}"
    volumes:
      - ./backend/storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: security-control-center-frontend:latest
    container_name: scc-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
